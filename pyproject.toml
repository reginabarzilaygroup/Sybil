[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sybil"
version = "1.7.1"
description = "Sybil: lung cancer risk prediction"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10,<3.12"
authors = [
    {name = "Peter G. Mikhael"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "imageio>=2.34.0",
    "importlib-metadata>=4.0",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.5",
    "pillow>=10.2.0",
    "pydicom>=2.3",
    "pylibjpeg[all]>=2.0",
    "torch>=2.0",
    "torchio>=0.18",
    "torchvision>=0.15",
    "tqdm>=4.62",
    "loguru>=0.7",
]

[project.optional-dependencies]
v2 = [
    "antspyx>=0.6",
    "connected-components-3d>=3.24",
    "dynamic-network-architectures>=0.4",
    "easydict>=1.13",
    "einops>=0.8",
    "huggingface-hub>=0.25",
    "itk>=5.4",
    "lungmask>=0.2.20",
    "monai>=1.5",
    "nibabel>=5.0",
    "nnunetv2>=2.6",
    "pandas>=2.0",
    "pytorch-lightning>=2.0",
    "rad-vision-engine>=1.0",
    "safetensors>=0.4",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "simpleitk>=2.5",
    # torch-scatter: installed separately via find-links (CUDA-specific wheels)
    # uv pip install torch-scatter -f https://data.pyg.org/whl/torch-2.7.0+cu126.html
    "transformers>=4.40",
    "pyyaml>=6.0",
]
train = [
    "albumentations>=2.0",
    "lifelines>=0.30",
    "pytorch-lightning>=2.0",
    "scikit-learn>=1.4",
]
testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
]

[project.scripts]
sybil-predict = "sybil.predict:main"

[project.urls]
Documentation = "https://github.com/reginabarzilaygroup/sybil/wiki"
Source = "https://github.com/reginabarzilaygroup/sybil"
Tracker = "https://github.com/reginabarzilaygroup/sybil/issues"

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
rad-vision-engine = { git = "https://github.com/YalaLab/rave", branch = "main" }

[tool.setuptools]
packages = {find = {exclude = ["tests"]}}

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[tool.pytest.ini_options]
norecursedirs = [".git", "dist", "build", ".tox"]
addopts = "--verbose"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203", "E501"]
